<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Baseline model AUROC by PCA rank</title>
  <desc id="desc">Line plot of mean AUROC across catalase, motility, and sporulation for simple downstream models at PCA ranks 6, 10, and 25.</desc>
  <style>
    .axis { stroke: #222; stroke-width: 1.6; }
    .grid { stroke: #d8d8d8; stroke-width: 1; }
    .txt { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 15px; }
    .small { font-family: Arial, Helvetica, sans-serif; fill: #333; font-size: 13px; }
    .head { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 21px; font-weight: 700; }
    .log { stroke: #1f77b4; fill: none; stroke-width: 3; }
    .sgd { stroke: #7f7f7f; fill: none; stroke-width: 3; }
    .rf { stroke: #2ca02c; fill: none; stroke-width: 3; }
    .gd { stroke: #d62728; fill: none; stroke-width: 3; }
    .poly { stroke: #9467bd; fill: none; stroke-width: 3; }
    .ens { stroke: #111; fill: none; stroke-width: 4; stroke-dasharray: 9 5; }
  </style>

  <text x="55" y="48" class="head">Mean AUROC across catalase, motility, and sporulation</text>
  <text x="55" y="75" class="small">Frozen ESM-2 embeddings; family-held-out split; PCA rank sweep. Source: paper/tables/32_baseline_regressors.md.</text>

  <!-- Plot area: x 100..790, y 105..455. AUROC scale 0.68..0.84 -->
  <line x1="100" y1="455" x2="790" y2="455" class="axis"/>
  <line x1="100" y1="105" x2="100" y2="455" class="axis"/>

  <!-- y grid/ticks -->
  <line x1="100" y1="455" x2="790" y2="455" class="grid"/><text x="58" y="460" class="small">0.68</text>
  <line x1="100" y1="367.5" x2="790" y2="367.5" class="grid"/><text x="58" y="372" class="small">0.72</text>
  <line x1="100" y1="280" x2="790" y2="280" class="grid"/><text x="58" y="285" class="small">0.76</text>
  <line x1="100" y1="192.5" x2="790" y2="192.5" class="grid"/><text x="58" y="197" class="small">0.80</text>
  <line x1="100" y1="105" x2="790" y2="105" class="grid"/><text x="58" y="110" class="small">0.84</text>

  <!-- x ticks rank 6=100, 10=445, 25=790 -->
  <line x1="100" y1="455" x2="100" y2="463" class="axis"/><text x="92" y="488" class="txt">6</text>
  <line x1="445" y1="455" x2="445" y2="463" class="axis"/><text x="433" y="488" class="txt">10</text>
  <line x1="790" y1="455" x2="790" y2="463" class="axis"/><text x="778" y="488" class="txt">25</text>
  <text x="414" y="528" class="txt">PCA rank before downstream model</text>
  <text x="18" y="295" class="txt" transform="rotate(-90 18 295)">Mean AUROC</text>

  <!-- Lines: y = 455 - (AUROC - .68)/.16*350 -->
  <!-- logistic: 0.751, 0.764, 0.808 -->
  <path d="M100 299.7 L445 271.3 L790 175.0" class="log"/>
  <circle cx="100" cy="299.7" r="5" fill="#1f77b4"/><circle cx="445" cy="271.3" r="5" fill="#1f77b4"/><circle cx="790" cy="175.0" r="5" fill="#1f77b4"/>

  <!-- sgd: 0.702, 0.733, 0.761 -->
  <path d="M100 406.9 L445 339.1 L790 277.8" class="sgd"/>
  <circle cx="100" cy="406.9" r="5" fill="#7f7f7f"/><circle cx="445" cy="339.1" r="5" fill="#7f7f7f"/><circle cx="790" cy="277.8" r="5" fill="#7f7f7f"/>

  <!-- rf: 0.770, 0.789, 0.803 -->
  <path d="M100 258.1 L445 216.6 L790 185.6" class="rf"/>
  <circle cx="100" cy="258.1" r="5" fill="#2ca02c"/><circle cx="445" cy="216.6" r="5" fill="#2ca02c"/><circle cx="790" cy="185.6" r="5" fill="#2ca02c"/>

  <!-- hist_gd: 0.781, 0.791, 0.803 -->
  <path d="M100 234.1 L445 212.2 L790 185.6" class="gd"/>
  <circle cx="100" cy="234.1" r="5" fill="#d62728"/><circle cx="445" cy="212.2" r="5" fill="#d62728"/><circle cx="790" cy="185.6" r="5" fill="#d62728"/>

  <!-- poly: 0.764, 0.785, 0.776 -->
  <path d="M100 271.3 L445 225.3 L790 245.0" class="poly"/>
  <circle cx="100" cy="271.3" r="5" fill="#9467bd"/><circle cx="445" cy="225.3" r="5" fill="#9467bd"/><circle cx="790" cy="245.0" r="5" fill="#9467bd"/>

  <!-- ensemble constant 0.824 -->
  <path d="M100 140.0 L790 140.0" class="ens"/>
  <text x="806" y="145" class="small">soft-vote ensemble 0.824</text>

  <!-- Legend -->
  <rect x="835" y="185" width="220" height="190" fill="#f7f7f7" stroke="#c6c6c6"/>
  <text x="855" y="215" class="head">Model family</text>
  <line x1="858" y1="242" x2="908" y2="242" class="log"/><text x="922" y="247" class="small">L2 logistic</text>
  <line x1="858" y1="270" x2="908" y2="270" class="sgd"/><text x="922" y="275" class="small">SGD logistic</text>
  <line x1="858" y1="298" x2="908" y2="298" class="rf"/><text x="922" y="303" class="small">Regularized RF</text>
  <line x1="858" y1="326" x2="908" y2="326" class="gd"/><text x="922" y="331" class="small">Hist gradient boosting</text>
  <line x1="858" y1="354" x2="908" y2="354" class="poly"/><text x="922" y="359" class="small">Polynomial logistic</text>
</svg>
