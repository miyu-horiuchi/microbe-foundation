<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Frozen embedding baseline-regressor experiment schematic</title>
  <desc id="desc">Pipeline from bacterial genome to frozen ESM2 embedding, PCA rank bottleneck, simple downstream models, and family-held-out evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.6; rx: 14; }
      .accent { fill: #e8f1fb; stroke: #1f5f99; stroke-width: 1.8; rx: 14; }
      .warn { fill: #fff4e5; stroke: #9a5b00; stroke-width: 1.8; rx: 14; }
      .txt { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 18px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #333; font-size: 14px; }
      .head { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 20px; font-weight: 700; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <text x="38" y="45" class="head">Baseline readout experiment: is encoder fine-tuning necessary?</text>
  <text x="38" y="72" class="small">All models use the same family-held-out split and the same frozen ESM-2 genome embeddings.</text>

  <rect x="40" y="130" width="165" height="110" class="box"/>
  <text x="70" y="168" class="head">Genome</text>
  <text x="64" y="198" class="small">BacDive strain</text>
  <text x="58" y="219" class="small">with labels</text>

  <path d="M 205 185 L 280 185" class="arrow"/>

  <rect x="285" y="130" width="180" height="110" class="accent"/>
  <text x="326" y="162" class="head">Frozen</text>
  <text x="315" y="190" class="head">ESM-2</text>
  <text x="306" y="217" class="small">640-d genome vector</text>

  <path d="M 465 185 L 540 185" class="arrow"/>

  <rect x="545" y="130" width="170" height="110" class="warn"/>
  <text x="586" y="165" class="head">PCA rank</text>
  <text x="575" y="195" class="small">6, 10, 25</text>
  <text x="572" y="216" class="small">capacity sweep</text>

  <path d="M 715 185 L 790 185" class="arrow"/>

  <rect x="795" y="88" width="245" height="195" class="box"/>
  <text x="845" y="122" class="head">Simple heads</text>
  <text x="825" y="154" class="small">L2 logistic regression</text>
  <text x="825" y="178" class="small">SGD logistic classifier</text>
  <text x="825" y="202" class="small">Polynomial logistic</text>
  <text x="825" y="226" class="small">Regularized random forest</text>
  <text x="825" y="250" class="small">Histogram gradient boosting</text>

  <path d="M 918 283 L 918 340" class="arrow"/>

  <rect x="765" y="342" width="305" height="52" class="accent"/>
  <text x="800" y="374" class="head">Family-held-out AUROC / Macro-F1</text>

  <text x="42" y="315" class="head">Interpretation</text>
  <text x="42" y="344" class="small">If simple readouts are strong, frozen embeddings already contain trait signal.</text>
  <text x="42" y="366" class="small">If rank 25 beats rank 6, this is not a 6-dimensional perturbation-style task.</text>
</svg>
